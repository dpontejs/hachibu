[project]
name = "hachibu"
version = "0.1.0"
description = "Coach pessoal de treino e dieta com agentes de IA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hachibu"]
# Hatch inclui arquivos não-Python dentro do pacote (migrations/*.sql, data/*.csv).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Starlette sugere httpx2; httpx fica até a troca (mesma decisão do repo today).
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hachibu"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]
